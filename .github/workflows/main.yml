name: Pi-hole 完整 Web UI Magisk 模块（方案一 - lighttpd + PHP 修复版）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 下載官方 FTL
        run: wget -q https://github.com/pi-hole/FTL/releases/latest/download/pihole-FTL-arm64 -O pihole-FTL && chmod +x pihole-FTL

      - name: 下載並編譯 lighttpd 1.4.82 靜態版（arm64-android）
        run: |
          # 下載 Android NDK (r27 為例，較新且穩定)
          NDK_VER="r27"
          wget -q https://dl.google.com/android/repository/android-ndk-${NDK_VER}-linux.zip -O ndk.zip
          unzip -q ndk.zip
          mv android-ndk-${NDK_VER} /opt/ndk
          
          # 設定 toolchain (aarch64-linux-android)
          export NDK=/opt/ndk
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export TARGET=aarch64-linux-android
          export API=21  # Android 最低 API，可依需求調高
          export AR=$TOOLCHAIN/bin/llvm-ar
          export CC=$TOOLCHAIN/bin/$TARGET$API-clang
          export CXX=$TOOLCHAIN/bin/$TARGET$API-clang++
          export LD=$TOOLCHAIN/bin/ld.lld
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          
          # 下載 lighttpd 源碼
          wget -q https://download.lighttpd.net/lighttpd/releases-1.4.x/lighttpd-1.4.82.tar.gz
          tar -xzf lighttpd-1.4.82.tar.gz
          cd lighttpd-1.4.82
          
          # 設定 configure 為靜態編譯，禁用共享庫，針對 Android 調整
          ./configure \
            --host=$TARGET \
            --prefix=/data/adb/modules/pihole-lighttpd-php \
            --disable-shared \
            --enable-static \
            --without-bzip2 \
            --without-fam \
            --without-ldap \
            --without-lua \
            --without-memcached \
            --without-mysql \
            --without-webdav-props \
            --with-openssl \
            CFLAGS="-O2 -fPIC -static" \
            LDFLAGS="-static -lc -lm -ldl" \
            ac_cv_func_fork=yes \
            ac_cv_func_vfork=no \
            ac_cv_func_pipe2=no
          
          make -j$(nproc)
          $STRIP src/lighttpd
          cp src/lighttpd ../lighttpd-static
          chmod +x ../lighttpd-static
          cd ..

      - name: 下載 PHP-CGI 靜態文件（你提供的連結）
        run: |
          wget -q https://yydf.540734621.xyz/ejz/php_armv8a.zip -O php.zip
          unzip php.zip -d php-static
          mv php-static/php-cgi php-static/php-cgi-arm64
          chmod +x php-static/php-cgi-arm64

      - name: 下載官方 Web UI
        run: |
          git clone --depth=1 https://github.com/pi-hole/web.git web-src

      - name: 構建 Magisk 模塊
        run: |
          MODULE="pihole-lighttpd-php"
          mkdir -p $MODULE/system/bin $MODULE/etc/pihole $MODULE/www/admin $MODULE/log $MODULE/etc/lighttpd

          # FTL
          cp pihole-FTL $MODULE/system/bin/pihole-FTL
          chmod 755 $MODULE/system/bin/pihole-FTL

          # Pi-hole 腳本
          git clone --depth=1 https://github.com/pi-hole/pi-hole.git src
          cp src/pihole $MODULE/system/bin/pihole
          cp src/gravity.sh $MODULE/etc/pihole/
          chmod +x $MODULE/system/bin/pihole $MODULE/etc/pihole/gravity.sh

          # Web UI
          cp -r web-src/admin/* $MODULE/www/admin/

          # lighttpd + PHP
          cp lighttpd-static $MODULE/system/bin/lighttpd
          cp php-static/php-cgi-arm64 $MODULE/system/bin/php-cgi
          chmod 755 $MODULE/system/bin/lighttpd $MODULE/system/bin/php-cgi

          # lighttpd.conf 配置（保持原樣）
          cat > $MODULE/etc/lighttpd/lighttpd.conf << 'EOF'
          server.document-root = "/data/adb/modules/pihole-lighttpd-php/www/admin"
          server.port = 5555
          server.bind = "0.0.0.0"
          server.pid-file = "/data/adb/modules/pihole-lighttpd-php/log/lighttpd.pid"
          server.errorlog = "/data/adb/modules/pihole-lighttpd-php/log/lighttpd.log"
          server.modules = ( "mod_fastcgi" )

          fastcgi.debug = 0
          fastcgi.server = ( ".php" =>
            ( "localhost" =>
              ( "socket" => "/tmp/php-cgi.sock",
                "bin-path" => "/data/adb/modules/pihole-lighttpd-php/system/bin/php-cgi",
                "check-local" => "disable",
                "max-procs" => 1
              )
            )
          )
          EOF

          # module.prop（版本可改用日期）
          cat > $MODULE/module.prop << EOF
          id=pihole-lighttpd-php
          name=Pi-hole 完整 Web UI (lighttpd + PHP)
          version=$(date +%Y%m%d)
          versionCode=$(date +%s)
          author=方案一修复版（lighttpd 1.4.82 自編譯）
          description=FTL + lighttpd 1.4.82 static + PHP-CGI + 官方WebUI + 端口5555
          EOF

          # post-fs-data.sh 和 service.sh 保持原樣（略）

          # ...（後續 post-fs-data.sh、service.sh、pihole.toml 的 cat 內容保持與原碼相同，此處省略重複貼上）

          cd $MODULE
          zip -r ../pihole-lighttpd-php-magisk.zip .
          cd ..

      - name: 上傳 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lighttpd-1.4.82-${{ github.run_number }}
          name: Pi-hole lighttpd 1.4.82 + PHP Magisk 模塊（自編譯版）
          files: pihole-lighttpd-php-magisk.zip
          draft: false
