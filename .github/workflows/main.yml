name: Pi-hole Android (FTL built-in Web) bundle

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "Android ABI"
        required: true
        default: "arm64-v8a"
      ftl_tag:
        description: "FTL release tag (empty = latest)"
        required: false
        default: ""
      dns_port:
        description: "DNS port for non-root"
        required: true
        default: "8053"
      web_port:
        description: "Web port for non-root"
        required: true
        default: "8080"

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl git jq tar unzip xz-utils file

      - name: Download FTL Android binary from release
        id: ftl
        run: |
          set -euo pipefail
          ABI="${{ inputs.abi }}"
          TAG="${{ inputs.ftl_tag }}"
          REPO="pi-hole/FTL"

          api_base="https://api.github.com/repos/${REPO}/releases"
          if [ -n "$TAG" ]; then
            rel_json="$(curl -fsSL "${api_base}/tags/${TAG}")"
          else
            rel_json="$(curl -fsSL "${api_base}/latest")"
          fi

          tag_name="$(echo "$rel_json" | jq -r .tag_name)"
          echo "Using FTL release: $tag_name"

          url="$(echo "$rel_json" | jq -r --arg abi "$ABI" '
            .assets[]
            | select(
                (.name|ascii_downcase|test("android"))
                and (
                  (.name|ascii_downcase|test("arm64"))
                  or (.name|ascii_downcase|test("aarch64"))
                  or (.name|ascii_downcase|test($abi))
                )
              )
            | .browser_download_url
          ' | head -n1)"

          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "ERROR: Could not find Android $ABI asset in release $tag_name"
            echo "$rel_json" | jq -r '.assets[].name'
            exit 1
          fi

          mkdir -p out/bin out/tmp
          curl -fL "$url" -o out/ftl_asset
          file out/ftl_asset || true

          if tar -tf out/ftl_asset >/dev/null 2>&1; then
            tar -xf out/ftl_asset -C out/tmp
          elif unzip -t out/ftl_asset >/dev/null 2>&1; then
            unzip -o out/ftl_asset -d out/tmp >/dev/null
          else
            cp -v out/ftl_asset out/bin/pihole-FTL
          fi

          if [ ! -f out/bin/pihole-FTL ]; then
            ftl_bin="$(find out/tmp -type f \( -name 'pihole-FTL' -o -name 'FTL' \) | head -n1 || true)"
            test -n "$ftl_bin"
            cp -v "$ftl_bin" out/bin/pihole-FTL
          fi

          chmod +x out/bin/pihole-FTL
          file out/bin/pihole-FTL || true

          echo "tag=$tag_name" >> "$GITHUB_OUTPUT"

      - name: Fetch Web repo (latest)
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/pi-hole/web.git out/web-src

      - name: Create bundle (FTL + web root + config + scripts)
        run: |
          set -euo pipefail
          DNS_PORT="${{ inputs.dns_port }}"
          WEB_PORT="${{ inputs.web_port }}"

          B="out/bundle"
          mkdir -p "$B"/{bin,etc,db,logs,web}

          cp -v out/bin/pihole-FTL "$B/bin/pihole-FTL"
          cp -a out/web-src/. "$B/web/"

          # Config: DNS + web (best-effort keys; unknown keys are typically ignored)
          cat > "$B/etc/pihole-FTL.conf" <<EOF
          SOCKET_LISTENING=all
          DNSMASQ_LISTENING=all
          PORT=${DNS_PORT}
          SETCAP=0

          DBFILE=/data/local/tmp/pihole/db/pihole-FTL.db
          LOGFILE=/data/local/tmp/pihole/logs/pihole-FTL.log

          # Built-in web (keys may differ across v6 builds; adjust after checking "pihole-FTL -h")
          WEB_PORT=${WEB_PORT}
          WEBROOT=/data/local/tmp/pihole/web
          EOF

          # One-shot start script (foreground)
          cat > "$B/start.sh" <<'EOF'
          #!/system/bin/sh
          set -eu

          BASE="/data/local/tmp/pihole"
          mkdir -p "$BASE"/{bin,etc,db,logs,web}

          # Install/update payload
          cp -f "$BASE/bundle/bin/pihole-FTL" "$BASE/bin/pihole-FTL"
          chmod +x "$BASE/bin/pihole-FTL"

          # Stage web root that FTL will serve
          rm -rf "$BASE/web"
          cp -a "$BASE/bundle/web" "$BASE/web"

          # Config
          if [ ! -f "$BASE/etc/pihole-FTL.conf" ]; then
            cp -f "$BASE/bundle/etc/pihole-FTL.conf" "$BASE/etc/pihole-FTL.conf"
          fi

          # If your FTL requires explicit CLI flags for web, set them here:
          #   FTL_OPTS="--web-port 8080 --web-root $BASE/web"
          FTL_OPTS="${FTL_OPTS:-}"

          exec "$BASE/bin/pihole-FTL" -c "$BASE/etc/pihole-FTL.conf" -f $FTL_OPTS
          EOF
          chmod +x "$B/start.sh"

          cat > "$B/README.txt" <<EOF
          Pi-hole Android bundle (FTL built-in Web)
          - FTL: ${{ steps.ftl.outputs.tag }}
          - Web: pi-hole/web (latest)

          Deploy:
            adb push out/bundle /data/local/tmp/pihole/bundle
            adb shell 'cd /data/local/tmp/pihole/bundle && ./start.sh'

          DNS test:
            dig @<phone-ip> -p ${DNS_PORT} example.com

          Web:
            http://<phone-ip>:${WEB_PORT}
            (If it doesn't open, run: /data/local/tmp/pihole/bin/pihole-FTL -h
             then set FTL_OPTS in start.sh accordingly.)
          EOF

      - name: Pack artifact
        run: |
          set -euo pipefail
          tar -czf "pihole-android-${{ inputs.abi }}-ftl_${{ steps.ftl.outputs.tag }}.tar.gz" -C out bundle
          ls -lh *.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pihole-android-${{ inputs.abi }}-ftl_${{ steps.ftl.outputs.tag }}
          path: pihole-android-${{ inputs.abi }}-ftl_*.tar.gz
