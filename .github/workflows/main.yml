name: Pi-hole 完整 Web UI Magisk 模块（方案一 - static-web-server + PHP 版）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 下載官方 FTL
        run: wget -q https://github.com/pi-hole/FTL/releases/latest/download/pihole-FTL-arm64 -O pihole-FTL && chmod +x pihole-FTL

      - name: 下載 static-web-server aarch64-android 靜態 binary（最新 v2.41.0）
        run: |
          wget -q https://github.com/static-web-server/static-web-server/releases/download/v2.41.0/static-web-server-v2.41.0-aarch64-linux-android.tar.gz -O sws.tar.gz
          tar -xzf sws.tar.gz
          mv static-web-server-v2.41.0-aarch64-linux-android/static-web-server sws-static
          chmod +x sws-static
          

      - name: 下載 PHP-CGI 靜態文件（rentry000/pihole php.zip）
        run: |
          wget -q https://github.com/rentry000/pihole/raw/refs/heads/main/php.zip -O php.zip
          unzip php.zip -d php-static
          echo "=== unzip 後的檔案列表 ==="
          ls -R php-static
          find php-static -type f -exec ls -lh {} \;

          # 強制使用 bin/php（從 log 看它存在且是 binary）
          if [ -f "php-static/bin/php" ]; then
            cp php-static/bin/php php-static/php-cgi-arm64
            chmod +x php-static/php-cgi-arm64
            echo "已複製 bin/php → php-cgi-arm64（忽略 ELF 檢查，因為 runner 架構不同）"
            # 顯示 file 輸出（debug）
            file php-static/php-cgi-arm64 || echo "file 指令輸出（預期顯示 ARM aarch64）"
          else
            echo "錯誤：php-static/bin/php 不存在！"
            exit 1
          fi

      - name: 下載官方 Web UI
        run: |
          git clone --depth=1 https://github.com/pi-hole/web.git web-src

      - name: 構建 Magisk 模塊
        run: |
          MODULE="pihole-sws-php"
          mkdir -p $MODULE/system/bin $MODULE/etc/pihole $MODULE/www/admin $MODULE/log

          # FTL
          cp pihole-FTL $MODULE/system/bin/pihole-FTL
          chmod 755 $MODULE/system/bin/pihole-FTL

          # Pi-hole 腳本
          git clone --depth=1 https://github.com/pi-hole/pi-hole.git src
          cp src/pihole $MODULE/system/bin/pihole
          cp src/gravity.sh $MODULE/etc/pihole/
          chmod +x $MODULE/system/bin/pihole $MODULE/etc/pihole/gravity.sh

          # Web UI（靜態 + 動態部分）
          cp -r web-src/admin/* $MODULE/www/admin/

          # static-web-server + PHP-CGI
          cp sws-static $MODULE/system/bin/static-web-server
          cp php-static/php-cgi-arm64 $MODULE/system/bin/php-cgi
          chmod 755 $MODULE/system/bin/static-web-server $MODULE/system/bin/php-cgi

          # module.prop
          cat > $MODULE/module.prop << EOF
          id=pihole-sws-php
          name=Pi-hole Web UI (static-web-server + PHP)
          version=$(date +%Y%m%d)
          versionCode=$(date +%s)
          author=方案一 - sws + PHP 版
          description=FTL + static-web-server + PHP-CGI + 官方WebUI + 端口5555。支援完整動態功能。
          EOF

          # post-fs-data.sh
          cat > $MODULE/post-fs-data.sh << 'EOF'
          #!/system/bin/sh
          MODDIR=${0%/*}
          mkdir -p /etc/pihole
          ln -sf $MODDIR/etc/pihole/pihole.toml /etc/pihole/pihole.toml
          mkdir -p $MODDIR/log
          chmod 777 $MODDIR/log
          setcap 'cap_net_bind_service=+ep' $MODDIR/system/bin/pihole-FTL 2>/dev/null || true
          setcap 'cap_net_bind_service=+ep' $MODDIR/system/bin/static-web-server 2>/dev/null || true
          EOF
          chmod 755 $MODULE/post-fs-data.sh

          # service.sh - 先啟動 php-cgi，再啟動 static-web-server 並轉發 .php 請求
          cat > $MODULE/service.sh << 'EOF'
          #!/system/bin/sh
          LOG=/data/adb/modules/pihole-sws-php/service.log
          echo "=== Pi-hole 啟動 $(date) ===" > $LOG

          /data/adb/modules/pihole-sws-php/system/bin/pihole-FTL >> $LOG 2>&1 &

          # 啟動 PHP-CGI (綁定 unix socket)
          /data/adb/modules/pihole-sws-php/system/bin/php-cgi -b /tmp/php-cgi.sock >> $LOG 2>&1 &

          # 啟動 static-web-server 並啟用 fastcgi 轉發
          /data/adb/modules/pihole-sws-php/system/bin/static-web-server \
            --port 5555 \
            --addr 0.0.0.0 \
            --root /data/adb/modules/pihole-sws-php/www/admin \
            --log-file /data/adb/modules/pihole-sws-php/log/sws.log \
            --fcgi /tmp/php-cgi.sock:.php \
            --log-level info \
            --no-compression >> $LOG 2>&1 &

          echo "static-web-server + PHP 已啟動，Web UI: http://127.0.0.1:5555/admin" >> $LOG
          EOF
          chmod 755 $MODULE/service.sh

          cat > $MODULE/etc/pihole/pihole.toml << 'EOF'
          [dns]
            port = 53
            blocking = true
            block = "NXDOMAIN"
            dnssec = false
          EOF

          cd $MODULE
          zip -r ../pihole-sws-php-magisk.zip .
          cd ..

      - name: 上傳 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sws-php-${{ github.run_number }}
          name: Pi-hole static-web-server + PHP Magisk 模塊
          files: pihole-sws-php-magisk.zip
          draft: false
