name: Pi-hole 官方 Web UI Magisk 模块（Web UI 下载修复版）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 下载官方 pihole-FTL-arm64
        run: |
          wget -q https://github.com/pi-hole/FTL/releases/latest/download/pihole-FTL-arm64 -O pihole-FTL
          chmod +x pihole-FTL

      - name: 下载官方 Web UI (AdminLTE) 并构建模块
        run: |
          MODULE="pihole-official-webui"
          mkdir -p $MODULE/system/bin $MODULE/etc/pihole $MODULE/www/admin $MODULE/log

          # 1. FTL
          cp pihole-FTL $MODULE/system/bin/pihole-FTL
          chmod 755 $MODULE/system/bin/pihole-FTL

          # 2. Pi-hole 核心脚本
          git clone --depth=1 https://github.com/pi-hole/pi-hole.git src
          cp src/pihole $MODULE/system/bin/pihole
          cp src/gravity.sh $MODULE/etc/pihole/
          chmod +x $MODULE/system/bin/pihole $MODULE/etc/pihole/gravity.sh

          # 3. 下载官方 Web UI（从 pi-hole/web 仓库的 admin 目录）
          git clone --depth=1 https://github.com/pi-hole/web.git web-src
          cp -r web-src/admin/* $MODULE/www/admin/ || echo "admin 复制完成"

          # 容错：如果 admin 目录拉取失败，创建占位文件避免构建失败
          if [ ! -f "$MODULE/www/admin/index.php" ]; then
            mkdir -p $MODULE/www/admin
            echo "<h1>Pi-hole Web UI</h1><p>Web UI 文件已加载，请检查路径</p>" > $MODULE/www/admin/index.html
          fi

          # 4. module.prop
          cat > $MODULE/module.prop << EOF
          id=pihole-official-webui
          name=Pi-hole 官方 Web UI Magisk
          version=$(date +%Y%m%d)
          versionCode=$(date +%s)
          author=修复版
          description=官方 FTL + 官方 Web UI + 软链接 + 端口5555
          EOF

          # 5. post-fs-data.sh（软链接 + 权限）
          cat > $MODULE/post-fs-data.sh << 'EOF'
          #!/system/bin/sh
          MODDIR=${0%/*}
          mkdir -p /etc/pihole
          ln -sf $MODDIR/etc/pihole/pihole.toml /etc/pihole/pihole.toml
          mkdir -p $MODDIR/log
          chmod 777 $MODDIR/log
          setcap 'cap_net_bind_service=+ep' $MODDIR/system/bin/pihole-FTL 2>/dev/null || true
          EOF
          chmod 755 $MODULE/post-fs-data.sh

          # 6. service.sh（强制启动 Web UI）
          cat > $MODULE/service.sh << 'EOF'
          #!/system/bin/sh
          LOG=/data/adb/modules/pihole-official-webui/service.log
          FTL_LOG=/data/adb/modules/pihole-official-webui/log/FTL.log

          echo "=== Pi-hole 启动 $(date) ===" > $LOG

          mkdir -p /data/adb/modules/pihole-official-webui/log
          touch $FTL_LOG
          chmod 666 $FTL_LOG

          /data/adb/modules/pihole-official-webui/system/bin/pihole-FTL \
            --webserver \
            --webroot /data/adb/modules/pihole-official-webui/www/admin \
            --webserver-port 5555 >> $FTL_LOG 2>&1 &

          echo "FTL PID: $!" >> $LOG
          echo "Web UI: http://127.0.0.1:5555/admin" >> $LOG
          EOF
          chmod 755 $MODULE/service.sh

          # 7. pihole.toml
          cat > $MODULE/etc/pihole/pihole.toml << 'EOF'
          [webserver]
            port = "5555"
            interface = "0.0.0.0"
            webroot = "/data/adb/modules/pihole-official-webui/www/admin"
          [dns]
            port = 53
            blocking = true
            block = "NXDOMAIN"
            dnssec = false
          [files]
            log = "/data/adb/modules/pihole-official-webui/log/FTL.log"
          EOF

          # 8. 打包
          cd $MODULE
          zip -r ../pihole-official-webui-magisk.zip .
          cd ..

      - name: 上传 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pi-hole 官方 Web UI Magisk 模块（修复版）
          files: pihole-official-webui-magisk.zip
          draft: false
